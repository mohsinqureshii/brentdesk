    <!--
      AdSense overlay-format control.

      Previously this block contained (a) a script that hijacked
      window.google_ad_modifications to set adsense_auto_ads:false on every
      pageload and (b) a CSS sheet that matched .google-auto-placed,
      ins.adsbygoogle[data-ad-format="auto"], and :has(iframe[id*="aswift"]).
      Combined those killed nearly every legitimate AdSense unit, not only
      the vignette / anchor overlays we wanted to suppress.

      Replaced with the OFFICIAL AdSense page-level config: vignette_ads /
      side_rail / overlay_bottom flags only. AdSense reads these BEFORE
      placing ads, so disallowed formats simply never get rendered (vs the
      old approach of letting Google place them and CSS-hiding them after).

      To toggle these at runtime, use the Auto Ads control in the admin
      Advertising Manager → Programmatic → AdSense, which writes to
      seoSettings and the SSR layer can swap this script's payload.
    -->
    <script>
      (function () {
        // Publisher id is public information (it's in /ads.txt). Hardcoding
        // it here makes page-level Auto Ads independent of the database —
        // previously window.GOOGLE_ADSENSE_CLIENT was never set anywhere,
        // so this push carried an empty client and Auto Ads never ran.
        window.GOOGLE_ADSENSE_CLIENT = window.GOOGLE_ADSENSE_CLIENT || "pub-2487563355490273";
        window.adsbygoogle = window.adsbygoogle || [];
        window.adsbygoogle.pauseAdRequests = 0;
        // page-level config — disable only the most intrusive auto formats.
        // Inline AdSense units (with explicit data-ad-slot) are unaffected.
        window.adsbygoogle.push({
          params: {
            google_ad_client: "ca-" + window.GOOGLE_ADSENSE_CLIENT,
            enable_page_level_ads: true,
            overlays: { bottom: false }, // suppress sticky bottom anchor bar
            vignette: false,             // suppress full-screen interstitials
          },
        });
      })();
    </script>
    <!-- AdSense loader — loaded unconditionally so Auto Ads work on every
         page. Per-slot units (AdUnit.tsx) detect this tag and reuse it. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2487563355490273"
      crossorigin="anonymous"
    ></script>
    <style>
      /*
        Defensive CSS — only kicks in if AdSense ignores the config above
        and renders an overlay anyway. Selectors target the actual overlay
        markers (data-anchor-status / data-vignette-status) rather than
        every absolutely-positioned ad iframe, so legitimate inline ads
        in the article body, sidebar, and leaderboard slots are untouched.
      */
      ins.adsbygoogle[data-anchor-status],
      ins.adsbygoogle[data-vignette-status] {
        display: none !important;
      }

    <!-- Google Fonts loaded as non-render-blocking: preload-as-style swap pattern.
         Saves ~200-500ms on the LCP path on slow connections by letting HTML
         parse + paint while the stylesheet downloads in parallel.
         display=swap is in the URL itself; FOUT > render-blocking. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"

    <!-- Umami analytics: deferred + idle-callback to keep it off the INP critical
         path. Falls back to a 3-second timeout if requestIdleCallback is unavailable
         (Safari pre-16.4 / older browsers). -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var siteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        // When the env var is absent at build time the token is left in
        // place verbatim — as "%VITE_...%", not "VITE_...". Bail on both
        // shapes, otherwise the page requests "/%VITE_ANALYTICS_ENDPOINT%/umami"
        // and takes a 400 plus a strict-MIME console error on every load.
        function unresolved(v) {
          return !v || v.indexOf("VITE_") === 0 || v.charAt(0) === "%";
        }
        if (unresolved(endpoint) || unresolved(siteId)) return;
        function load() {
          var s = document.createElement("script");
          s.defer = true;
          s.src = endpoint + "/umami";
          s.setAttribute("data-website-id", siteId);
          document.body.appendChild(s);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(load, { timeout: 3000 });
        } else {
          setTimeout(load, 1500);
        }
      })();
    </script>
