<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <!--
      Publication identity in this static shell mirrors shared/publication.ts.
      This file cannot import TypeScript, so the values are literal — when the
      publication identity changes, update shared/publication.ts first and
      keep this file in sync (the brand regression test guards drift).
    -->

    <!-- Primary Meta Tags -->
    <title>BrentDesk | Industry, Infrastructure & the Physical Economy</title>
    <meta name="title" content="BrentDesk | Industry, Infrastructure & the Physical Economy" />
    <meta name="description" content="BrentDesk covers the physical economy — construction, infrastructure, energy, manufacturing, logistics, transportation, mining, utilities and industrial technology — across Saudi Arabia, the GCC and MENA." />
    <meta name="keywords" content="construction news, infrastructure, energy, oil and gas, manufacturing, logistics, transportation, mining, utilities, industrial technology, Saudi Arabia, GCC, MENA, projects, contracts, EPC" />
    <meta name="author" content="BrentDesk" />
    <!-- canonical URL injected dynamically by SSR per page -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brentdesk.com/" />
    <meta property="og:title" content="BrentDesk | Industry, Infrastructure & the Physical Economy" />
    <meta property="og:description" content="BrentDesk covers the physical economy — construction, infrastructure, energy, manufacturing, logistics and industrial technology across Saudi Arabia, the GCC and MENA." />
    <meta property="og:image" content="https://brentdesk.com/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="BrentDesk" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://brentdesk.com/" />
    <meta name="twitter:title" content="BrentDesk | Industry, Infrastructure & the Physical Economy" />
    <meta name="twitter:description" content="BrentDesk covers the physical economy — construction, infrastructure, energy, manufacturing, logistics and industrial technology across Saudi Arabia, the GCC and MENA." />
    <meta name="twitter:image" content="https://brentdesk.com/assets/og-image.png" />

    <!-- Additional SEO -->
    <meta name="geo.region" content="SA" />
    <meta name="geo.placename" content="Riyadh" />
    <meta name="language" content="English" />
    <meta name="rating" content="general" />

    <!-- News Publisher -->

    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="msapplication-TileColor" content="#0b0d12" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrentDesk" />

    <!-- Site-wide JSON-LD: NewsMediaOrganization + WebSite.
         NewsMediaOrganization is what Google requires for News eligibility and
         publisher sitelinks. Per-page SSR adds Article/Breadcrumb on top. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "@id": "https://brentdesk.com/#organization",
      "name": "BrentDesk",
      "legalName": "BrentDesk Media",
      "alternateName": ["brentdesk.", "brentdesk"],
      "url": "https://brentdesk.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://brentdesk.com/assets/icon-512x512.png",
        "width": 512,
        "height": 512,
        "caption": "BrentDesk"
      },
      "image": "https://brentdesk.com/assets/og-image.png",
      "description": "BrentDesk covers the physical economy — construction, infrastructure, energy, manufacturing, logistics, transportation, mining, utilities and industrial technology — across Saudi Arabia, the GCC and MENA.",
      "foundingDate": "2026",
      "areaServed": [
        { "@type": "Country", "name": "Saudi Arabia" },
        { "@type": "Place", "name": "Gulf Cooperation Council" },
        { "@type": "Place", "name": "Middle East" },
        { "@type": "Place", "name": "North Africa" }
      ],
      "knowsAbout": [
        "Construction", "Infrastructure", "Energy", "Oil and Gas",
        "Manufacturing", "Logistics", "Transportation", "Mining",
        "Utilities", "Real Estate Development", "Industrial Technology"
      ],
      "sameAs": [
        "https://x.com/brentdesk",
        "https://www.linkedin.com/company/brentdesk",
        "https://www.instagram.com/brentdesk",
        "https://www.youtube.com/@brentdesk"
      ],
      "contactPoint": [{
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@brentdesk.com",
        "availableLanguage": ["English", "Arabic"]
      }]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://brentdesk.com/#website",
      "url": "https://brentdesk.com/",
      "name": "BrentDesk",
      "description": "Industry, infrastructure and the physical economy — news, companies, people, events and jobs.",
      "publisher": { "@id": "https://brentdesk.com/#organization" },
      "inLanguage": "en-US",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://brentdesk.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "BrentDesk sections",
      "itemListElement": [
        { "@type": "SiteNavigationElement", "position": 1, "name": "News",      "url": "https://brentdesk.com/news" },
        { "@type": "SiteNavigationElement", "position": 2, "name": "Companies", "url": "https://brentdesk.com/companies" },
        { "@type": "SiteNavigationElement", "position": 3, "name": "People",    "url": "https://brentdesk.com/people" },
        { "@type": "SiteNavigationElement", "position": 4, "name": "Events",    "url": "https://brentdesk.com/events" },
        { "@type": "SiteNavigationElement", "position": 5, "name": "Jobs",      "url": "https://brentdesk.com/jobs" }
      ]
    }
    </script>
    <!--SSR_WEBPAGE_PLACEHOLDER-->

    <!-- CWV: preconnect to font origins so TLS handshakes start while the
         HTML is still parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts loaded as non-render-blocking: preload-as-style swap pattern.
         display=swap is in the URL itself; FOUT > render-blocking.

         Google Sans for display, Google Sans Text for body — Google's own
         pairing; Text is drawn for small sizes. Both stop at 700, so nothing
         on the site should ask for 800. Neither family carries Arabic, which
         is what makes the pairing with STC Forward clean: there is no weight
         at which a browser could pick a Latin face for an Arabic word. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;700&display=swap"
      />
    </noscript>

    <style>
      /*
        Defensive CSS — suppresses AdSense overlay formats (anchor bars and
        vignettes) if a future AdSense integration renders one. Inline units
        placed by AdUnit.tsx are untouched. The AdSense loader itself is not
        shipped in the shell; it is injected per-slot once an AdSense account
        is configured in Admin → Advertising → AdSense.
      */
      ins.adsbygoogle[data-anchor-status],
      ins.adsbygoogle[data-vignette-status] {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics: deferred + idle-callback to keep it off the INP critical
         path. Falls back to a 3-second timeout if requestIdleCallback is unavailable
         (Safari pre-16.4 / older browsers). -->
    <script>
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var siteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        // When the env var is absent at build time the token is left in
        // place verbatim — as "%VITE_...%", not "VITE_...". Bail on both
        // shapes, otherwise the page requests "/%VITE_ANALYTICS_ENDPOINT%/umami"
        // and takes a 400 plus a strict-MIME console error on every load.
        function unresolved(v) {
          return !v || v.indexOf("VITE_") === 0 || v.charAt(0) === "%";
        }
        if (unresolved(endpoint) || unresolved(siteId)) return;
        function load() {
          var s = document.createElement("script");
          s.defer = true;
          s.src = endpoint + "/umami";
          s.setAttribute("data-website-id", siteId);
          document.body.appendChild(s);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(load, { timeout: 3000 });
        } else {
          setTimeout(load, 1500);
        }
      })();
    </script>
  </body>

</html>
