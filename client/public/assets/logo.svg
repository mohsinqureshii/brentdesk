  <text x="0" y="53" font-family="Inter Tight, Inter, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#ffffff">brentdesk<tspan fill="#2563eb">.</tspan></text>
</svg>
