name: LEAP/DeepFest batch — import & publish

# Runs the LEAP/DeepFest editorial batch against the production database
# from a GitHub runner, so no local setup is needed: pick a step from the
# dropdown, press "Run workflow", read the log.
#
# The steps are deliberately separate and in order. Run them one at a
# time and read the output before moving on:
#
#   1. preflight          read-only. Every row must say OK.
#   1b. fix-preconditions  creates the desk author, the company/person
#                          workflow statuses and the Gulf Region row that
#                          preflight reports missing. Idempotent — running
#                          it twice creates nothing extra.
#   2. dry-run     validates all 100 articles. Writes nothing.
#   3. import      creates the 100 articles as DRAFTS. Nothing goes live.
#   3b. normalise-style  applies house style to the imported drafts:
#                       sentence-case headlines, no section headings, no
#                       reference block. Snapshots first; restore-style
#                       puts every article back exactly as imported.
#   3c2. attribution      adds the closing line "TechScoop is reporting
#                        from LEAP 2026 in Riyadh", plus the source
#                        publication. No dateline prefix: 78 of the 100
#                        ledes already say Riyadh, so "Riyadh — … in
#                        Riyadh" would read as a stutter. Pass --dateline
#                        to the script directly if you want it anyway.
#                        Interview lines are NOT generated: they only
#                        appear when a real interview file is supplied.
#                        restore-attribution undoes it.
#   3d. categories-list    read-only: the news categories this site has,
#                        the batch's current distribution, and which
#                        mapping targets have no matching category.
#   3e. categorise         assigns a main category plus sub-categories
#                        from each article's own words. Never creates a
#                        category. restore-categories undoes it.
#   3c. review-sheet     builds a one-page review of all 100 (image,
#                       headline, lede, counts, flags) and uploads it as
#                       a downloadable artifact.
#   4. publish     takes them live. Use "limit" to release a first tranche.
#   5. revert      puts published articles in this batch back to draft.
#
# WHY A RUNNER AND NOT THE APP CONTAINER: the production image ships
# neither content/ (the 100 images and the manifest) nor tsx, which is a
# devDependency. A runner has the full repo and dev dependencies.
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   DATABASE_URL            production MySQL. Must be the PUBLIC url — a
#                           runner cannot reach Railway's internal host.
#   JWT_SECRET              any non-empty value; the env contract requires it.
#   S3_ENDPOINT             R2 endpoint, needed by "import" to upload images
#   S3_BUCKET               .
#   S3_ACCESS_KEY_ID        .
#   S3_SECRET_ACCESS_KEY    .
#   S3_PUBLIC_URL           public base url images are served from
#
# Only "import" needs the S3 secrets. preflight, dry-run, publish and
# revert need just DATABASE_URL and JWT_SECRET.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - verify
          - fix-preconditions
          - dry-run
          - import
          - normalise-style
          - attribution
          - restore-attribution
          - categories-list
          - categorise
          - restore-categories
          - review-sheet
          - restore-style
          - publish
          - revert
      batch:
        description: "Batch key"
        required: true
        default: leap-deepfest-2026-day1
      limit:
        description: "publish/revert only — how many articles (0 = all)"
        required: false
        default: "0"

concurrency:
  group: leap-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile

      - name: Show what will run
        run: |
          echo "step  : ${{ inputs.step }}"
          echo "batch : ${{ inputs.batch }}"
          echo "limit : ${{ inputs.limit }}"

      - name: Preflight (read-only)
        if: inputs.step == 'preflight'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/run-sql.mjs scripts/sql/leap-batch-preflight.sql

      - name: Verify import (read-only)
        if: inputs.step == 'verify'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/run-sql.mjs scripts/sql/leap-batch-verify.sql

      - name: Fix missing preconditions
        if: inputs.step == 'fix-preconditions'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node scripts/ci/run-sql.mjs scripts/sql/leap-batch-fix-preconditions.sql
          echo "--- re-running preflight ---"
          node scripts/ci/run-sql.mjs scripts/sql/leap-batch-preflight.sql

      - name: Dry run (writes nothing)
        if: inputs.step == 'dry-run'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/import-leap-deepfest-editorial-batch.ts

      - name: Import as drafts
        if: inputs.step == 'import'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_PUBLIC_URL: ${{ secrets.S3_PUBLIC_URL }}
        run: pnpm exec tsx scripts/import-leap-deepfest-editorial-batch.ts --execute --confirm-unpublished-drafts

      - name: Normalise to house style
        if: inputs.step == 'normalise-style'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/normalise-editorial-batch.ts --batch='${{ inputs.batch }}' --execute

      - name: Restore pre-style snapshot
        if: inputs.step == 'restore-style'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/normalise-editorial-batch.ts --batch='${{ inputs.batch }}' --restore --execute

      - name: Add reporting line
        if: inputs.step == 'attribution'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pnpm exec tsx scripts/attribute-editorial-batch.ts \
            --batch='${{ inputs.batch }}' --sourceline --execute

      - name: Restore pre-attribution snapshot
        if: inputs.step == 'restore-attribution'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pnpm exec tsx scripts/attribute-editorial-batch.ts \
            --batch='${{ inputs.batch }}' --restore --execute

      - name: List categories
        if: inputs.step == 'categories-list'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/categorise-editorial-batch.ts --batch='${{ inputs.batch }}' --list

      - name: Categorise
        if: inputs.step == 'categorise'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/categorise-editorial-batch.ts --batch='${{ inputs.batch }}' --execute

      - name: Restore categories
        if: inputs.step == 'restore-categories'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/categorise-editorial-batch.ts --batch='${{ inputs.batch }}' --restore --execute

      - name: Build review sheet
        if: inputs.step == 'review-sheet'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: pnpm exec tsx scripts/build-batch-review-sheet.ts --batch='${{ inputs.batch }}' --out=batch-review.html

      - name: Upload review sheet
        if: inputs.step == 'review-sheet'
        uses: actions/upload-artifact@v4
        with:
          name: batch-review-sheet
          path: batch-review.html

      - name: Publish
        if: inputs.step == 'publish'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pnpm exec tsx scripts/publish-editorial-batch.ts \
            --batch='${{ inputs.batch }}' \
            --limit='${{ inputs.limit }}' \
            --execute

      - name: Revert to draft
        if: inputs.step == 'revert'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pnpm exec tsx scripts/publish-editorial-batch.ts \
            --batch='${{ inputs.batch }}' \
            --limit='${{ inputs.limit }}' \
            --revert --execute
