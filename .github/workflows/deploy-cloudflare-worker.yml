name: Deploy Cloudflare SEO Worker

# Auto-deploys cloudflare/seo-worker.js whenever the Worker source changes
# on main, so future SEO additions (new sitemap paths, header tweaks, etc.)
# go live without anyone having to run `wrangler deploy` manually.
#
# Required secret: CLOUDFLARE_API_TOKEN  — created via Cloudflare dashboard
# → My Profile → API Tokens → "Edit Cloudflare Workers" template (gives the
# token Workers:Edit on the account and Zone:Read on the techscoop.io zone).

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  # Allow a maintainer to trigger a deploy from the GitHub Actions UI even
  # when no source files changed — useful if the secret was rotated or a
  # past deploy failed and you want to retry.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy seo-worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
          # Wrangler reads name + main + routes from cloudflare/wrangler.toml.

      - name: Verify the apex /sitemap-images.xml route is live
        run: |
          set -e
          # Cloudflare's edge propagation is usually <10s but give it a buffer.
          sleep 15

          ct=$(curl -sI https://techscoop.io/sitemap-images.xml \
            | awk 'tolower($1)=="content-type:" {print tolower($2)}' | tr -d '\r')
          marker=$(curl -sI https://techscoop.io/sitemap-images.xml \
            | awk 'tolower($1)=="x-seo-worker:" {print $2}' | tr -d '\r')

          echo "content-type=$ct"
          echo "x-seo-worker=$marker"

          if [[ "$ct" != application/xml* ]]; then
            echo "::error::sitemap-images.xml is not returning XML (content-type=$ct)"
            exit 1
          fi
          if [[ -z "$marker" ]]; then
            echo "::warning::x-seo-worker header missing — Worker may not be on this route yet"
          fi

      - name: Smoke-check sitemap.xml index too
        run: |
          set -e
          first_line=$(curl -s https://techscoop.io/sitemap.xml | head -1)
          echo "first line: $first_line"
          if [[ "$first_line" != *"<?xml"* ]]; then
            echo "::error::sitemap.xml is not returning XML"
            exit 1
          fi
